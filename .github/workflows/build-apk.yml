name: Android APK Olustur

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Vakit APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_ENV: production

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Bagimliliklari kur
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Expo config kontrolu
        run: npx expo config --type public

      - name: Android native projesini olustur
        run: npx expo prebuild --platform android --clean --no-install

      - name: WorkManager surumlerini esitle
        run: |
          cat >> android/build.gradle <<'EOF'

          subprojects {
            configurations.configureEach {
              resolutionStrategy {
                force 'androidx.work:work-runtime:2.8.1'
                force 'androidx.work:work-runtime-ktx:2.8.1'
              }
            }
          }
          EOF

      - name: Gradle bellegini ayarla
        run: |
          sed -i '/^org\.gradle\.jvmargs=/d' android/gradle.properties || true
          sed -i '/^kotlin\.daemon\.jvmargs=/d' android/gradle.properties || true
          sed -i '/^org\.gradle\.workers\.max=/d' android/gradle.properties || true
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx1536m"
            echo "org.gradle.workers.max=2"
          } >> android/gradle.properties

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle iznini ayarla
        run: chmod +x android/gradlew

      - name: Standalone release APK derle
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2

      - name: APK dosyasini hazirla
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/Vakit-by-Baskaya.apk
          sha256sum output/Vakit-by-Baskaya.apk > output/Vakit-by-Baskaya.sha256

      - name: APK'yi GitHub Artifacts'e yukle
        uses: actions/upload-artifact@v4
        with:
          name: Vakit-by-Baskaya-APK
          path: |
            output/Vakit-by-Baskaya.apk
            output/Vakit-by-Baskaya.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Sonuc ozeti
        run: |
          echo "## Vakit APK hazir" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts bolumunden **Vakit-by-Baskaya-APK** paketini indirin." >> "$GITHUB_STEP_SUMMARY"
          echo "APK: \`Vakit-by-Baskaya.apk\`" >> "$GITHUB_STEP_SUMMARY"
